services:
  app:
    image: obnoxieux/skylarks-app-config:latest
    restart: unless-stopped
    networks:
      - proxy
    #ports:
    #  - '8080:8080'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.skylarks-app-config.rule=Host(`config.app.berlinskylarks.de`)"
      - "traefik.http.routers.skylarks-app-config.entrypoints=websecure"
      - "traefik.http.routers.skylarks-app-config.tls.certresolver=letsEncrypt"
      - "traefik.docker.network=proxy"
      - "traefik.http.middlewares.authentik-app-config.forwardauth.address=https://auth.berlinskylarks.de/outpost.goauthentik.io/auth/traefik"
      - "traefik.http.middlewares.authentik-app-config.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.authentik-app-config.forwardauth.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid,X-authentik-jwt,X-authentik-meta-jwks,X-authentik-meta-outpost,X-authentik-meta-provider,X-authentik-meta-app,X-authentik-meta-version"
      - "traefik.http.routers.skylarks-app-config.middlewares=authentik-app-config"
    volumes:
      - config_data:/app/

volumes:
  config_data:

networks:
  proxy:
    external: true
